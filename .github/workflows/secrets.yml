# Pemindaian secret (SEC-060). Sengaja TANPA path filter: secret bisa bocor lewat docs/, mobile-pro/,
# atau berkas root, bukan hanya backend/. Riwayat git dipindai penuh di setiap push/PR.
name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Binary resmi + verifikasi checksum, bukan gitleaks-action (aturan lisensinya untuk akun organisasi).
      - name: Pasang gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Pindai riwayat git
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
