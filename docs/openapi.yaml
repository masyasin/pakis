openapi: 3.1.0
info:
  title: PAKIS ONE API v1 (Pakis Pro)
  version: 1.0.0
  description: |
    API untuk aplikasi Flutter Pakis Pro. Sumber kebenaran tetap `docs/05-API-CONTRACT.md`;
    berkas ini melengkapi autentikasi & akun (T-031) dan absen inti (T-036). Endpoint
    koreksi (T-040), lalu riwayat, rekap, dan notifikasi milik sendiri (T-043).

    Header wajib di semua endpoint kecuali `GET /config`:
    - `X-App-Version` (semver) — di bawah `mobile.min_version` → 426 `APP_UPDATE_REQUIRED` (BR-027).
    - `X-Device-Id` (hash SHA-256 dari ANDROID_ID + install id) — endpoint ber-token wajib sama dengan
      perangkat pemilik token, selain itu token dicabut + 401 `DEVICE_MISMATCH` (BR-040, SEC-020).
    - `Accept: application/json`.
    Batas laju: 120 request/menit per token (SEC-068); unggah absen 10/menit per pengguna; login &
    lupa password punya batas sendiri.
servers:
  - url: /api/v1
tags:
  - name: Publik
  - name: Autentikasi
  - name: Akun
  - name: Absensi
  - name: Koreksi
  - name: Notifikasi
paths:
  /config:
    get:
      tags: [Publik]
      summary: Konfigurasi publik (05 §5.2)
      security: []
      responses:
        '200':
          description: Branding, versi minimum, aturan absen yang perlu diketahui klien.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  meta: { $ref: '#/components/schemas/Meta' }
  /auth/login:
    post:
      tags: [Autentikasi]
      summary: Login + registrasi perangkat (05 §5.3)
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, device]
              properties:
                login: { type: string, maxLength: 150, description: Username atau email }
                password: { type: string, maxLength: 200 }
                otp: { type: [string, 'null'], description: Kode authenticator 6 digit atau kode pemulihan bila MFA aktif }
                device:
                  type: object
                  required: [uid]
                  properties:
                    uid: { type: string, minLength: 16, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
                    model: { type: [string, 'null'], maxLength: 100 }
                    os_version: { type: [string, 'null'], maxLength: 40 }
      responses:
        '200':
          description: Perangkat aktif → token Sanctum terikat perangkat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      token_type: { type: string, enum: [Bearer] }
                      expires_at: { type: string, format: date-time, description: Sesuai `mobile.token_days` }
                      user: { $ref: '#/components/schemas/MobileUser' }
                      device:
                        type: object
                        properties:
                          status: { type: string, enum: [active] }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error', description: 'INVALID_CREDENTIALS (seragam, SEC-001), MFA_REQUIRED (details.mfa=true), MFA_INVALID' }
        '403': { $ref: '#/components/responses/Error', description: 'DEVICE_PENDING (tanpa token, menunggu persetujuan admin), MFA_SETUP_REQUIRED (aktivasi di web), FORBIDDEN (akun tanpa permission mobile)' }
        '422': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error', description: 'ACCOUNT_LOCKED, details.retry_after_s (BR-016)' }
        '426': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Autentikasi]
      summary: Keluar (cabut token HP ini)
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      tags: [Autentikasi]
      summary: Lupa password (FR-005) — respons selalu sama
      security: []
      parameters: [{ $ref: '#/components/parameters/AppVersion' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, channel]
              properties:
                login: { type: string, maxLength: 150 }
                channel: { type: string, enum: [email, whatsapp, telegram], description: 'Harus salah satu `auth.forgot_channels` dari /config' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/password/reset-otp:
    post:
      tags: [Autentikasi]
      summary: Reset password dengan kode OTP (FR-006)
      security: []
      parameters: [{ $ref: '#/components/parameters/AppVersion' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, code, password, password_confirmation]
              properties:
                login: { type: string }
                code: { type: string, pattern: '^\d{6,8}$' }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Error', description: 'Kode salah (pesan seragam) atau password tidak memenuhi kebijakan. Semua token API akun dicabut saat berhasil.' }
        '429': { $ref: '#/components/responses/Error' }
  /me:
    get:
      tags: [Akun]
      summary: Data akun saya
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MobileUser' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [Akun]
      summary: Ubah nomor HP & foto (mengubah HP wajib password saat ini)
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                phone: { type: [string, 'null'], pattern: '^\+?[0-9]{8,20}$' }
                avatar: { type: string, format: binary, description: 'PNG/JPG/WebP ≤ 2 MB' }
                current_password: { type: string }
      responses:
        '200': { description: Data akun terbaru }
        '403': { $ref: '#/components/responses/Error', description: PASSWORD_CHANGE_REQUIRED }
        '422': { $ref: '#/components/responses/Error' }
  /me/password:
    put:
      tags: [Akun]
      summary: Ganti password (token HP ini tetap aktif, token lain & sesi web dicabut)
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200': { description: Data akun terbaru (`must_change_password` = false) }
        '422': { $ref: '#/components/responses/Error' }
  /me/sessions/revoke-others:
    post:
      tags: [Akun]
      summary: Cabut semua sesi web milik sendiri
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Jumlah sesi web yang dicabut
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked: { type: integer }
  /me/avatar:
    get:
      tags: [Akun]
      summary: Foto profil milik sendiri (keputusan Mas 16 Nov 2026)
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Foto profil (selalu WebP), `Cache-Control` no-store
          content:
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error', description: 'NOT_FOUND (belum ada foto)' }
  /lookup/correction-reasons:
    get:
      tags: [Koreksi]
      summary: Pilihan alasan koreksi aktif dari referensi correction_reason (bukan daftar tetap di aplikasi)
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Alasan aktif, urut sort_order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: forgot }
                        name: { type: string, example: Lupa presensi }
        '403': { $ref: '#/components/responses/Error', description: 'FORBIDDEN (tanpa attendance_corrections.create)' }
  /attendance:
    get:
      tags: [Absensi]
      summary: Riwayat presensi milik sendiri (listing my_attendance_days, 05 §5.5, 07 §3.4)
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: q, in: query, schema: { type: string }, description: Bagian nama shift }
        - { name: 'filter[month]', in: query, schema: { type: string, example: 2026-11 }, description: 'Wajib di spec; kosong/tidak sah = bulan berjalan. Pilihan = 12 bulan terakhir (meta.listing).' }
        - { name: 'filter[status][]', in: query, schema: { type: string, enum: [present, late, early_leave, no_checkout, absent, holiday, off] } }
        - { name: sort, in: query, schema: { type: string, enum: [work_date, -work_date], default: -work_date } }
        - { name: per_page, in: query, schema: { type: integer, enum: [20, 50], default: 20 } }
      responses:
        '200':
          description: Satu halaman listing (meta.pagination & meta.listing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AttendanceHistoryItem' } }
                  meta: { type: object }
        '403': { $ref: '#/components/responses/Error', description: 'FORBIDDEN (tanpa attendance.self / akun tanpa pegawai)' }
    post:
      tags: [Absensi]
      summary: Absen masuk/pulang (05 §5.4, BR-060–BR-067)
      description: |
        Idempoten per `client_uuid`: kiriman ulang → 200 + `meta.replayed=true` dengan data lama (payload
        baru diabaikan); `client_uuid` milik akun lain → 409 `STATE_CONFLICT`. Pegawai selalu dari akun
        pemilik token. Online memakai waktu server; offline memakai `client_time` (≤ `attendance.offline_max_hours`).
        Lokasi palsu ditolak dan tidak disimpan. Batas laju 10/menit per pengguna.
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [client_uuid, type, client_time, is_offline, latitude, longitude, accuracy_m, is_mock]
              properties:
                client_uuid: { type: string, format: uuid, description: UUID v4 dari HP }
                type: { type: string, enum: [in, out] }
                client_time: { type: string, format: date-time, description: 'ISO-8601 dengan offset, mis. 2026-11-03T07:41:12+07:00' }
                is_offline: { type: boolean, description: "'1' atau '0'" }
                latitude: { type: number, minimum: -11, maximum: 6 }
                longitude: { type: number, minimum: 95, maximum: 141 }
                accuracy_m: { type: number, minimum: 0 }
                is_mock: { type: boolean, description: "'1' atau '0' dari Position.isMocked" }
                device_clock_offset_s: { type: [integer, 'null'], description: Selisih jam HP vs server terakhir diketahui }
                selfie: { type: string, format: binary, description: 'JPEG asli ≤ 300 KB; wajib bila attendance.require_selfie' }
      responses:
        '201':
          description: Absen baru tercatat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AttendanceDay' }
                  meta:
                    type: object
                    properties:
                      request_id: { type: string }
                      replayed: { type: boolean }
        '200': { description: 'Kiriman ulang (meta.replayed=true), bentuk sama dengan 201' }
        '403': { $ref: '#/components/responses/Error', description: 'FORBIDDEN (tanpa attendance.self)' }
        '409': { $ref: '#/components/responses/Error', description: 'ATTENDANCE_ALREADY_CHECKED_IN / ATTENDANCE_NOT_CHECKED_IN / STATE_CONFLICT' }
        '422': { $ref: '#/components/responses/Error', description: 'VALIDATION_FAILED / ATTENDANCE_NO_SCHEDULE / ATTENDANCE_OUTSIDE_WINDOW / ATTENDANCE_OUT_OF_RADIUS / ATTENDANCE_MOCK_LOCATION / ATTENDANCE_LOW_ACCURACY / ATTENDANCE_OFFLINE_TOO_OLD' }
        '429': { $ref: '#/components/responses/Error', description: RATE_LIMITED }
  /attendance/today:
    get:
      tags: [Absensi]
      summary: Hari kerja sekarang, jadwalnya, absennya, dan aksi berikutnya (beranda Pakis Pro)
      description: Shift malam yang sudah masuk dan belum pulang tetap ditampilkan sebagai hari kerja kemarin sampai jendela pulangnya lewat.
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      work_date: { type: string, format: date }
                      schedule:
                        type: object
                        properties:
                          kind: { type: string, enum: [shift, holiday, off, unscheduled] }
                          shift: { $ref: '#/components/schemas/ShiftBrief' }
                          holiday: { type: [string, 'null'] }
                      attendance: { oneOf: [{ $ref: '#/components/schemas/AttendanceDay' }, { type: 'null' }] }
                      next_action: { type: [string, 'null'], enum: [in, out, null] }
                  meta: { $ref: '#/components/schemas/Meta' }
  /attendance/summary:
    get:
      tags: [Absensi]
      summary: Rekap bulan milik sendiri (05 §5.6, definisi BR-072)
      description: |
        `present` = hari dengan presensi masuk (present/late/early_leave/no_checkout); `scheduled_days` =
        present + absent; `late`/`early_leave` = jumlah hari bermenit > 0; `no_checkout`/`absent`/`holiday`/`off`
        = jumlah hari berstatus itu; `corrections_pending` = koreksi menunggu untuk tanggal di bulan itu.
        Bulan berjalan hanya menghitung hari yang sudah berstatus.
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: month, in: query, schema: { type: string, example: 2026-11 }, description: 'YYYY-MM, default bulan berjalan' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      month: { type: string, example: 2026-11 }
                      scheduled_days: { type: integer }
                      present: { type: integer }
                      late: { type: integer }
                      early_leave: { type: integer }
                      no_checkout: { type: integer }
                      absent: { type: integer }
                      holiday: { type: integer }
                      off: { type: integer }
                      late_minutes_total: { type: integer }
                      corrections_pending: { type: integer }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/Error', description: 'FORBIDDEN (tanpa attendance.self / akun tanpa pegawai)' }
        '422': { $ref: '#/components/responses/Error', description: 'VALIDATION_FAILED (month bukan YYYY-MM)' }
  /notifications:
    get:
      tags: [Notifikasi]
      summary: Notifikasi milik sendiri (listing my_notifications, 07 §3.4, FR-030)
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: q, in: query, schema: { type: string }, description: Bagian judul atau isi }
        - { name: 'filter[read]', in: query, schema: { type: string, enum: [unread, read] }, description: 'Jumlah belum dibaca untuk lonceng = meta.pagination.total dengan filter[read]=unread&per_page=20' }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at], default: -created_at } }
        - { name: per_page, in: query, schema: { type: integer, enum: [20, 50], default: 20 } }
      responses:
        '200':
          description: Satu halaman listing (meta.pagination & meta.listing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  meta: { type: object }
  /notifications/{id}/read:
    post:
      tags: [Notifikasi]
      summary: Tandai satu notifikasi milik sendiri sebagai dibaca (idempoten)
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Notifikasi terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404': { $ref: '#/components/responses/Error', description: 'NOT_FOUND (tidak ada / milik orang lain)' }
  /notifications/read-all:
    post:
      tags: [Notifikasi]
      summary: Tandai semua notifikasi milik sendiri sebagai dibaca
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Jumlah yang baru ditandai
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { marked: { type: integer } } }
                  meta: { $ref: '#/components/schemas/Meta' }
  /attendance-corrections:
    get:
      tags: [Koreksi]
      summary: Koreksi presensi milik sendiri (listing my_corrections, 07 §3.4)
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: q, in: query, schema: { type: string }, description: Awal nomor koreksi }
        - { name: 'filter[status][]', in: query, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
        - { name: 'filter[month]', in: query, schema: { type: string, example: 2026-11 } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, work_date, -work_date], default: -created_at } }
      responses:
        '200': { $ref: '#/components/responses/CorrectionPage' }
        '403': { $ref: '#/components/responses/Error', description: 'FORBIDDEN (tanpa attendance_corrections.create / akun tanpa pegawai)' }
    post:
      tags: [Koreksi]
      summary: Ajukan koreksi presensi (05 §5.7, BR-069)
      description: |
        Pegawai = pemilik token. `work_date` ≤ hari ini dan ≥ hari ini − `attendance.correction_max_days`. Jam `HH:mm`
        lokal harus di jendela shift (BR-060); shift lintas malam: jam sebelum jendela masuk = keesokan harinya.
        Lampiran opsional JPEG/PNG/PDF ≤ `attendance.correction_attachment_max_kb` (isi berkas diperiksa).
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [work_date, type, reason_code, note]
              properties:
                work_date: { type: string, format: date }
                type: { type: string, enum: [check_in, check_out, both] }
                proposed_check_in: { type: string, example: '07:55', description: Wajib untuk check_in/both }
                proposed_check_out: { type: string, example: '16:05', description: Wajib untuk check_out/both }
                reason_code: { type: string, description: Kode correction_reason aktif }
                note: { type: string, minLength: 10, maxLength: 500 }
                attachment: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/CorrectionOne' }
        '403': { $ref: '#/components/responses/Error', description: FORBIDDEN }
        '409': { $ref: '#/components/responses/Error', description: CORRECTION_DUPLICATE_PENDING }
        '422': { $ref: '#/components/responses/Error', description: 'CORRECTION_NOT_ALLOWED / VALIDATION_FAILED (field jam, lampiran, alasan)' }
  /attendance-corrections/{id}/cancel:
    post:
      tags: [Koreksi]
      summary: Batalkan koreksi pending milik sendiri (06 §7.1)
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/CorrectionId' }]
      responses:
        '200': { $ref: '#/components/responses/CorrectionOne' }
        '404': { $ref: '#/components/responses/Error', description: 'NOT_FOUND (bukan milik sendiri)' }
        '409': { $ref: '#/components/responses/Error', description: STATE_CONFLICT }
  /attendance-corrections/{id}/attachment:
    get:
      tags: [Koreksi]
      summary: Unduh lampiran koreksi — pengaju atau pengguna berwenang memutuskan (06 §6), keputusan Mas 16 Nov 2026
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/CorrectionId' }]
      responses:
        '200':
          description: Berkas lampiran, `Content-Disposition` attachment, `Cache-Control` no-store
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error', description: 'NOT_FOUND (tidak ada, bukan wewenang, atau tanpa lampiran)' }
  /approvals/attendance-corrections:
    get:
      tags: [Koreksi]
      summary: Koreksi yang boleh diputuskan pengguna (listing approval_corrections, 06 §6)
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: q, in: query, schema: { type: string }, description: Nama/nomor pegawai atau nomor koreksi }
        - { name: 'filter[status][]', in: query, schema: { type: string, enum: [pending, approved, rejected, cancelled], default: pending } }
        - { name: 'filter[work_date][from]', in: query, schema: { type: string, format: date } }
        - { name: 'filter[work_date][to]', in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, work_date, -work_date], default: created_at } }
      responses:
        '200': { $ref: '#/components/responses/CorrectionPage' }
        '403': { $ref: '#/components/responses/Error', description: 'FORBIDDEN (tanpa attendance_corrections.approve)' }
  /approvals/attendance-corrections/{id}/approve:
    post:
      tags: [Koreksi]
      summary: Setujui koreksi (05 §5.8); jam diterapkan ke presensi hari itu, log asli utuh
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/CorrectionId' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 500 } } }
      responses:
        '200': { $ref: '#/components/responses/CorrectionOne' }
        '403': { $ref: '#/components/responses/Error', description: CORRECTION_SELF_APPROVAL }
        '404': { $ref: '#/components/responses/Error', description: 'NOT_FOUND (di luar wewenang 06 §6)' }
        '409': { $ref: '#/components/responses/Error', description: STATE_CONFLICT }
  /approvals/attendance-corrections/{id}/reject:
    post:
      tags: [Koreksi]
      summary: Tolak koreksi (05 §5.8)
      parameters: [{ $ref: '#/components/parameters/AppVersion' }, { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/CorrectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, minLength: 5, maxLength: 500 } } }
      responses:
        '200': { $ref: '#/components/responses/CorrectionOne' }
        '403': { $ref: '#/components/responses/Error', description: CORRECTION_SELF_APPROVAL }
        '404': { $ref: '#/components/responses/Error', description: NOT_FOUND }
        '409': { $ref: '#/components/responses/Error', description: STATE_CONFLICT }
        '422': { $ref: '#/components/responses/Error', description: 'VALIDATION_FAILED (note)' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      schema: { type: string, example: 1.0.3 }
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string }
    CorrectionId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    Meta:
      type: object
      properties:
        request_id: { type: string }
    MobileUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        has_avatar: { type: boolean }
        must_change_password: { type: boolean }
        employee:
          type: [object, 'null']
          properties:
            id: { type: integer }
            employee_number: { type: string }
            position: { type: [string, 'null'] }
            location: { type: [string, 'null'] }
        permissions:
          type: array
          description: Permission mobile yang dipegang (= ability token)
          items: { type: string, enum: [attendance.self, attendance_corrections.create, attendance_corrections.approve] }
    ShiftBrief:
      type: [object, 'null']
      properties:
        code: { type: string }
        name: { type: string }
        start: { type: string, example: '07:30' }
        end: { type: string, example: '16:30' }
    AttendanceDay:
      type: object
      properties:
        work_date: { type: string, format: date }
        status: { type: string, enum: [present, late, early_leave, no_checkout, absent, holiday, off] }
        late_minutes: { type: integer }
        shift: { $ref: '#/components/schemas/ShiftBrief' }
        check_in_at: { type: [string, 'null'], format: date-time }
        check_out_at: { type: [string, 'null'], format: date-time }
        location:
          type: [object, 'null']
          properties:
            name: { type: [string, 'null'] }
            distance_m: { type: [integer, 'null'] }
        is_offline: { type: boolean }
    AttendanceHistoryItem:
      type: object
      description: Satu hari di riwayat presensi milik sendiri (05 §5.5). Tanpa koordinat/selfie.
      properties:
        id: { type: integer }
        work_date: { type: string, format: date }
        status: { type: string, enum: [present, late, early_leave, no_checkout, absent, holiday, off] }
        shift: { $ref: '#/components/schemas/ShiftBrief' }
        check_in_at: { type: [string, 'null'], format: date-time }
        check_out_at: { type: [string, 'null'], format: date-time }
        late_minutes: { type: integer }
        early_leave_minutes: { type: integer }
        is_offline: { type: boolean }
        is_corrected: { type: boolean }
    Notification:
      type: object
      description: Notifikasi aplikasi (BR-070). Tautan web tidak dikirim ke HP.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: correction_decided }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
    Correction:
      type: object
      description: Objek koreksi (05 §5.7a). Waktu ISO-8601 dengan offset general.timezone.
      properties:
        id: { type: integer }
        number: { type: string, example: KOR-202611-0001 }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        work_date: { type: string, format: date }
        type: { type: string, enum: [check_in, check_out, both] }
        proposed_check_in: { type: [string, 'null'], example: '07:55' }
        proposed_check_out: { type: [string, 'null'] }
        reason: { type: object, properties: { code: { type: string }, name: { type: string } } }
        note: { type: string }
        has_attachment: { type: boolean }
        employee: { type: object, properties: { id: { type: integer }, employee_number: { type: string }, name: { type: string } } }
        approver: { type: [object, 'null'], properties: { name: { type: string } } }
        is_manual: { type: boolean, description: Presensi manual oleh admin/atasan (BR-069) }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        decided_by: { type: [object, 'null'], properties: { name: { type: string } } }
        decision_note: { type: [string, 'null'] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, description: 'Kode 05 §2.3' }
            message: { type: string }
            details: { type: object }
            request_id: { type: string }
  responses:
    CorrectionOne:
      description: Objek koreksi terbaru
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Correction' }
              meta: { $ref: '#/components/schemas/Meta' }
    CorrectionPage:
      description: Satu halaman listing (03 §, meta.pagination & meta.listing)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/Correction' } }
              meta: { type: object }
    Error:
      description: Galat (05 §2.2)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Message:
      description: Pesan sukses
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
security:
  - bearer: []
