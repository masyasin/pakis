name: pakis_pro
description: "Pakis Pro - absensi pegawai CV Pakis Jaya Abadi"
publish_to: 'none'

# `X-App-Version` = bagian sebelum `+` (semver, BR-027). Angka setelah `+` = versionCode Android.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Hanya paket di docs/03-ARCHITECTURE.md §5 (+ material_ui, disetujui 15 Nov 2026).
# Paket baru = berhenti & tanya Mas (CLAUDE.md §5). Lihat mobile-pro/CLAUDE.md "Paket".
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
